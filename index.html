<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторні роботи | Марк Гапяк</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Марк Гапяк</h1>
            <p>Група ІПЗ-22 | Інтерактивні лабораторні роботи з графів</p>
        </div>
    </header>

    <main class="container">
        <section class="lab-card json-input-section">
            <h2>Введення матриці суміжності (5x5)</h2>
            <p>Змінюй числа в полях, щоб перебудувати граф:</p>
            
            <div class="matrix-container" id="matrixInputs">
                </div>

            <div class="controls">
                <button class="btn" onclick="analyzeGraph()">1. Аналізувати граф (ЛР21)</button>
                <button class="btn btn-accent" onclick="runDFS()">2. Запустити DFS (ЛР22)</button>
            </div>
        </section>

        <section class="lab-card console-section">
            <h2>Консоль виведення програми</h2>
            <div class="console-output" id="consoleOutput">
                Тут з'явиться результат роботи алгоритмів...
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Марк Гапяк. Працює прямо у браузері.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
